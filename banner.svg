<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Himanshu Shrivastava, Full-Stack Developer and AI Application Builder" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.88" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridFade"><rect width="1200" height="340" fill="url(#gridFadeGrad)"/></mask>
  </defs>
  <style>
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
    .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; } .d4 { animation-delay: 2.4s; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" mask="url(#gridFade)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowBlue)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowCyan)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#3B82F6" stroke-opacity="0.25"/>

  <!-- neural / graph motif -->
  <g stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.2" fill="none">
    <path d="M880 70 L980 130 L1090 90"/>
    <path d="M980 130 L930 230 L1040 270"/>
    <path d="M980 130 L1060 200 L1040 270"/>
    <path d="M930 230 L1060 200"/>
    <path d="M1090 90 L1060 200"/>
  </g>
  <g fill="#22D3EE">
    <circle class="pulse" cx="880" cy="70" r="5"/>
    <circle class="pulse d2" cx="980" cy="130" r="7" fill="#3B82F6"/>
    <circle class="pulse d3" cx="1090" cy="90" r="5"/>
    <circle class="pulse d4" cx="930" cy="230" r="5" fill="#3B82F6"/>
    <circle class="pulse d2" cx="1060" cy="200" r="6"/>
    <circle class="pulse d3" cx="1040" cy="270" r="4" fill="#3B82F6"/>
  </g>

  <!-- content -->
  <g font-family="'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="72" y="104" font-size="14" font-weight="600" letter-spacing="4" fill="#22D3EE">FULL-STACK DEVELOPER  ×  AI APPLICATION BUILDER</text>
    <text x="72" y="178" font-size="60" font-weight="800" fill="#E5E7EB" letter-spacing="-1">Himanshu Shrivastava</text>
    <text x="72" y="222" font-size="21" fill="#94A3B8">Building AI-powered products, from APIs and data layers to LLM and voice workflows.</text>
    <rect x="72" y="248" width="120" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="288" font-size="15" fill="#94A3B8" letter-spacing="1">BCA  ·  React  ·  Django  ·  FastAPI  ·  Node.js  ·  LLMs  ·  Voice AI</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
